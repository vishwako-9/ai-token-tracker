[package]
name = "tokentracker-cli"
version = "0.1.0"
edition = "2021"
description = "Local-first AI coding token usage and cost tracker (Claude Code, OpenCode, Codex, Gemini CLI, Antigravity, Ollama)"
license = "MIT"
repository = "https://github.com/example/tokentracker-cli"

[[bin]]
name = "tokentracker"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
colored = "2"
crossterm = "0.28"
dirs = "5"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"